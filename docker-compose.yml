services:
  postgres:
    image: postgres:16-alpine
    container_name: biblioscan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: biblioscan
      POSTGRES_PASSWORD: biblioscan
      POSTGRES_DB: biblioscan
    ports:
      - "5432:5432"
    volumes:
      - biblioscan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioscan -d biblioscan"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  biblioscan_pgdata:
